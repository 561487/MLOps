services:
  redis:
    ports: !override
      - "16379:6379"


  mysql:
    ports: !override
      - "13306:3306"
    volumes:
      - ./data-dev/mysql:/var/lib/mysql
      - ./docker-add-file/mysqld.cnf:/etc/mysql/conf.d/mysqld.cnf

  frontend:
    ports: !override
      - "18080:80"


  myapp:
    entrypoint: [""]
    environment:
      KFJ_MODEL_REPO_API_URL: "${KFJ_MODEL_REPO_API_URL}"
      PROMETHEUS_BASE_URL: "${PROMETHEUS_BASE_URL:-}"
      PROMETHEUS_QUERY_TIMEOUT: "${PROMETHEUS_QUERY_TIMEOUT:-10}"
      INFERENCE_MONITOR_SUMMARY_CACHE_TTL: "${INFERENCE_MONITOR_SUMMARY_CACHE_TTL:-10}"
      INFERENCE_MONITOR_TIMESERIES_CACHE_TTL: "${INFERENCE_MONITOR_TIMESERIES_CACHE_TTL:-30}"
