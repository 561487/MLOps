services:
  redis:
    ports: !override
      - "16379:6379"


  frontend:
    ports: !override
      - "18080:80"


  myapp:
    entrypoint: [""]
    environment:
      PROMETHEUS_BASE_URL: "${PROMETHEUS_BASE_URL:-}"
      PROMETHEUS_QUERY_TIMEOUT: "${PROMETHEUS_QUERY_TIMEOUT:-10}"
      INFERENCE_MONITOR_SUMMARY_CACHE_TTL: "${INFERENCE_MONITOR_SUMMARY_CACHE_TTL:-10}"
      INFERENCE_MONITOR_TIMESERIES_CACHE_TTL: "${INFERENCE_MONITOR_TIMESERIES_CACHE_TTL:-30}"
