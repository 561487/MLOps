apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

configMapGenerator:
- name: kubeflow-dashboard-config
  files:
  - config/config.py
  - config/entrypoint.sh
  - config/project.py
# kubectl delete configmap kubeflow-dashboard-config -n infra
# kubectl create configmap kubeflow-dashboard-config --from-file=config -n infra

- name: deploy-config
  literals:
  - STAGE=prod
  - REDIS_HOST=redis-master.infra
  - REDIS_PORT=6379
  - REDIS_PASSWORD=admin
  - MYSQL_SERVICE=mysql+pymysql://root:admin@10.121.177.221:3306/kubeflow?charset=utf8mb4
  - ENVIRONMENT=DEV
  - PROMETHEUS_BASE_URL=http://prometheus-k8s.monitoring:9090


vars:
- name: STAGE
  objref:
    kind: ConfigMap
    name: deploy-config
    apiVersion: v1
  fieldref:
    fieldpath: data.STAGE

resources:
  - ../base

images:
- name: ccr.ccs.tencentyun.com/cube-studio/kubeflow-dashboard
  newName: 10.121.177.20:8082/mlops/kubeflow-dashboard
  newTag: v1.8-prod
- name: ccr.ccs.tencentyun.com/cube-studio/kubeflow-dashboard-frontend
  newName: 10.121.177.20:8082/mlops/kubeflow-dashboard-frontend
  newTag: v2.2-prod


# kustomize build . | kubectl apply -f -




