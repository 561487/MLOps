# encoding: utf-8
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-resource-monitor
  namespace: infra
  labels:
    app: workflow-resource-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-resource-monitor
  template:
    metadata:
      name: workflow-resource-monitor
      labels:
        app: workflow-resource-monitor
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubeflow-dashboard
                operator: In
                values:
                - "true"
      volumes:
        - name: tz-config
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
        - name: kubeflow-dashboard-config
          configMap:
            name: kubeflow-dashboard-config
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
              - key: config.py
                path: config.py
              - key: project.py
                path: project.py
        - name: kubernetes-config
          configMap:
            name: kubernetes-config

      serviceAccountName: kubeflow-dashboard
      imagePullSecrets:
        - name: hubsecret
      containers:
        - name: workflow-resource-monitor
          image: 10.121.177.20:8082/mlops/kubeflow-dashboard:v2.2-prod
          imagePullPolicy: Always
          workingDir: /home/myapp
          command: ["python", "myapp/tools/workflow_resource_monitor.py"]
          env:
          - name: STAGE
            value: $(STAGE)
          - name: MYSQL_SERVICE
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: MYSQL_SERVICE
          - name: ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: ENVIRONMENT
          - name: PROMETHEUS_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: PROMETHEUS_BASE_URL
          - name: RESOURCE_MONITOR_INTERVAL
            value: "10"
          volumeMounts:
            - name: kubeflow-dashboard-config
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
            - name: kubeflow-dashboard-config
              mountPath: /home/myapp/myapp/config.py
              subPath: config.py
            - name: kubeflow-dashboard-config
              mountPath: /home/myapp/myapp/project.py
              subPath: project.py
            - name: tz-config
              mountPath: /etc/localtime
            - name: kubernetes-config
              mountPath: /home/myapp/kubeconfig
          resources:
            limits:
              cpu: 2
              memory: 2Gi
            requests:
              cpu: 10m
              memory: 100Mi
