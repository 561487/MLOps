              mountPath: /device-config.yaml
              subPath: device-config.yaml
            - name: tls-config
              mountPath: /tls
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                - hami-scheduler
            topologyKey: "kubernetes.io/hostname"
      volumes:
        - name: tls-config
