# MLOps 平台生产环境 CI/CD
# 构建流程对齐 install/docker/deploy_ops.sh
#
# 触发方式：仅当 tag 以 -prod 结尾时自动创建 Pipeline 并部署（如 v0.1-prod）
# 其他 tag（无 -prod 后缀）或普通 push 均不触发
# 操作流程：打 tag v0.1-prod → 自动 build → 自动 deploy
# 镜像版本号 = tag 全名（如 v0.1-prod）
#
# GitLab CI/CD Variables（已在 Settings → CI/CD → Variables 配置）：
#   HARBOR_REGISTRY        Harbor 地址
#   HARBOR_USER            Harbor 用户名
#   HARBOR_PASSWORD        Harbor 密码（Masked + Protected）
#   HARBOR_PROJECT         Harbor 项目名
#   DEPLOY_SERVER_IP       部署机 IP（有 kubectl 权限）
#   DEPLOY_USER            SSH 用户
#   SSH_PRIVATE_KEY        部署机 SSH 私钥（File 类型）
#   DEPLOY_PATH            部署机上项目根目录
#
# 可选：
#   K8S_NAMESPACE          默认 infra
#
# Runner 要求：标签 docker，docker executor + docker.sock 挂载

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /-prod$/
    - when: never

stages:
  - build
  - deploy

variables:
  K8S_NAMESPACE: "infra"
  BACKEND_IMAGE: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/kubeflow-dashboard"
  FRONTEND_IMAGE: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/kubeflow-dashboard-frontend"

default:
  tags:
    - docker

# 解析镜像版本号：优先 CI_COMMIT_TAG → IMAGE_TAG 变量 → 当天日期
.resolve_image_tag: &resolve_image_tag
  - |
    if [ -n "${CI_COMMIT_TAG:-}" ]; then
      export IMAGE_TAG="${CI_COMMIT_TAG}"
    elif [ -n "${IMAGE_TAG:-}" ]; then
      export IMAGE_TAG="${IMAGE_TAG}"
    else
      export IMAGE_TAG="$(date +%Y.%m.%d)"
    fi
    echo "IMAGE_TAG=${IMAGE_TAG}"

.harbor_login_env: &harbor_login_env
  - export HARBOR_REGISTRY="${HARBOR_REGISTRY}"
  - export HARBOR_PROJECT="${HARBOR_PROJECT}"
  - export HARBOR_USER="${HARBOR_USER}"
  - export HARBOR_PASSWORD="${HARBOR_PASSWORD}"

# ---------------------------------------------------------------------------
# 构建：编译前端静态资源 + 构建推送前后端镜像（等同 deploy_ops.sh 默认步骤）
# ---------------------------------------------------------------------------
build:
  stage: build
  script:
    - *resolve_image_tag
    - *harbor_login_env
    - bash install/docker/deploy_ops.sh
        --frontend-assets
        --backend-image
        --frontend-image
        -t "${IMAGE_TAG}"
  rules:
    - if: $CI_COMMIT_TAG =~ /-prod$/

# ---------------------------------------------------------------------------
# 部署：更新 kustomization 镜像标签 + SSH 到部署机执行 kubectl apply
# Runner 与部署机分离：在部署机上更新配置并滚动发布
# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  needs:
    - build
  script:
    - *resolve_image_tag
    - *harbor_login_env
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "${SSH_PRIVATE_KEY}" ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - |
      ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_SERVER_IP}" bash -s <<EOF
        set -euo pipefail
        KUSTOMIZATION_FILE="${DEPLOY_PATH}/install/kubernetes/cube/overlays/kustomization.yml"
        BACKEND_IMAGE="${BACKEND_IMAGE}"
        FRONTEND_IMAGE="${FRONTEND_IMAGE}"
        IMAGE_TAG="${IMAGE_TAG}"
        K8S_NAMESPACE="${K8S_NAMESPACE}"

        echo "[deploy] 更新 kustomization.yml (tag: \${IMAGE_TAG})"
        sed -i \
          -e "s|newName: .*kubeflow-dashboard-frontend|newName: \${FRONTEND_IMAGE}|" \
          -e "s|newName: .*kubeflow-dashboard|newName: \${BACKEND_IMAGE}|" \
          -e "s/newTag: .*/newTag: \${IMAGE_TAG}/g" \
          "\${KUSTOMIZATION_FILE}"

        echo "[deploy] kubectl apply -k cube/overlays"
        cd "${DEPLOY_PATH}/install/kubernetes"
        kubectl apply -k cube/overlays

        echo "[deploy] 等待滚动更新完成..."
        kubectl rollout status deployment/kubeflow-dashboard -n "\${K8S_NAMESPACE}" --timeout=600s
        kubectl rollout status deployment/kubeflow-dashboard-frontend -n "\${K8S_NAMESPACE}" --timeout=600s
        echo "[deploy] 完成"
      EOF
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG =~ /-prod$/
