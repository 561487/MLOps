<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIHub - Cube Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.15);
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .subtitle { color: #666; font-size: 16px; line-height: 1.6; }
        .features { display: flex; justify-content: center; gap: 24px; margin: 32px 0; flex-wrap: wrap; }
        .feature { background: #f5f3ff; border-radius: 12px; padding: 20px 16px; flex: 1; min-width: 120px; }
        .feature .icon { font-size: 28px; margin-bottom: 8px; }
        .feature .name { font-size: 13px; color: #5b21b6; font-weight: 600; }
        .link {
            display: inline-block; margin-top: 24px; padding: 12px 32px;
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
            border-radius: 8px; text-decoration: none; font-weight: 600;
            transition: transform .2s, box-shadow .2s;
        }
        .link:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AIHub</div>
        <p class="subtitle">Cube Studio 模型市场<br>探索、训练、部署 AI 模型的一站式平台</p>
        <div class="features">
            <div class="feature"><div class="icon">📷</div><div class="name">机器视觉</div></div>
            <div class="feature"><div class="icon">🎧</div><div class="name">听觉</div></div>
            <div class="feature"><div class="icon">💬</div><div class="name">自然语言</div></div>
            <div class="feature"><div class="icon">🤖</div><div class="name">大模型</div></div>
        </div>
        <a class="link" href="https://github.com/tencentmusic/cube-studio" target="_blank">访问 Cube Studio →</a>
    </div>
</body>
</html>
